<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Flujo de una solicitud</title>
<style>
  body { margin: 0; background: #ffffff; }
  svg { display: block; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
</style>
</head>
<body>
<svg id="d" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
// Colors taken from the architecture diagram already in the document.
const C = {
  client: { fill: '#f6f7f9', stroke: '#5b616e' },
  api:    { fill: '#fff3e6', stroke: '#e07b00' },
  db:     { fill: '#e8f0fe', stroke: '#3b78e7' },
  sqs:    { fill: '#fdebf1', stroke: '#d6336c' },
  worker: { fill: '#fff3e6', stroke: '#e07b00' },
};
const W = 1040;
const actors = [
  { id: 'client', x: 120,  title: 'Solicitante', sub: 'frontend del alta' },
  { id: 'api',    x: 320, title: 'scoring-api', sub: 'ECS · node index.js' },
  { id: 'db',     x: 520, title: 'DynamoDB', sub: 'tabla Scorings' },
  { id: 'sqs',    x: 720, title: 'SQS', sub: 'scoring-jobs' },
  { id: 'worker', x: 920, title: 'scoring-worker', sub: 'ECS · node worker.js' },
];
const X = Object.fromEntries(actors.map(a => [a.id, a.x]));

// Steps: kind msg (solid), ret (dashed), self (worker work), group frames and a note.
const steps = [
  ['msg', 'client', 'api', 'POST /scoring { CI, Nombre, IngresoMensual, … }'],
  ['msg', 'api', 'db', 'PutItem (estado PENDIENTE)'],
  ['msg', 'api', 'sqs', 'SendMessage { id, datos }'],
  ['ret', 'api', 'client', '202 { id, estado: PENDIENTE } · ~0,3 s'],
  ['frame-start', 'loop', 'cada 2 a 3 s, mientras el estado sea PENDIENTE', 'client', 'db'],
  ['msg', 'client', 'api', 'GET /scoring/:id'],
  ['msg', 'api', 'db', 'GetItem'],
  ['ret', 'api', 'client', '200 { estado: PENDIENTE }'],
  ['frame-end'],
  ['frame-start', 'en paralelo', 'el worker procesa la cola por su cuenta', 'db', 'worker'],
  ['msg', 'worker', 'sqs', 'ReceiveMessage (long polling 20 s)'],
  ['msg', 'worker', 'db', 'GetItem: si ya está COMPLETADO, descarta el duplicado'],
  ['self', 'worker', 'calcularScore: 1.500.000 simulaciones (~5 s)'],
  ['msg', 'worker', 'db', 'UpdateItem → COMPLETADO (o ERROR si los datos son inválidos)'],
  ['msg', 'worker', 'sqs', 'DeleteMessage (recién al final)'],
  ['frame-end'],
  ['msg', 'client', 'api', 'GET /scoring/:id'],
  ['msg', 'api', 'db', 'GetItem'],
  ['ret', 'api', 'client', '200 { estado: COMPLETADO, score, cuota, aprobado }'],
  ['note', 'Si el worker se detiene antes de DeleteMessage, el mensaje vuelve a la cola a los 60 s y lo toma otro worker. Tras 3 fallos pasa a scoring-jobs-dlq.'],
];

const svg = document.getElementById('d');
const NS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs, text) => {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (text !== undefined) {
    e.textContent = text;
    e.setAttribute('stroke', '#ffffff'); e.setAttribute('stroke-width', '5');
    e.setAttribute('stroke-linejoin', 'round'); e.setAttribute('paint-order', 'stroke');
  }
  svg.appendChild(e);
  return e;
};

// Arrowheads.
const defs = el('defs', {});
defs.innerHTML = `
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker>`;

el('text', { x: W / 2, y: 38, 'text-anchor': 'middle', 'font-size': 22, 'font-weight': 700, fill: '#1f2328' },
  'Flujo de una solicitud: aceptación inmediata y cálculo asíncrono');

const boxTop = 62, boxH = 58, boxW = 170;
let y = boxTop + boxH + 40;
const frames = [];
const draws = [];   // drawn after we know the total height, so lifelines sit behind

for (const s of steps) {
  const kind = s[0];
  if (kind === 'frame-start') {
    frames.push({ label: s[1], cond: s[2], from: s[3], to: s[4], y0: y - 6 });
    y += 46;
  } else if (kind === 'frame-end') {
    const f = frames.pop();
    draws.push(['frame', f, y - 4]);
    y += 18;
  } else if (kind === 'self') {
    draws.push(['self', s, y]);
    y += 62;
  } else if (kind === 'note') {
    draws.push(['note', s, y]);
    y += 70;
  } else {
    draws.push(['arrow', s, y]);
    y += 40;
  }
}
const H = y + 10;
svg.setAttribute('width', W);
svg.setAttribute('height', H);
svg.setAttribute('viewBox', `0 0 ${W} ${H}`);

// Lifelines and actor boxes.
for (const a of actors) {
  el('line', { x1: a.x, y1: boxTop + boxH, x2: a.x, y2: H - 80, stroke: '#9aa1ab', 'stroke-width': 1.2, 'stroke-dasharray': '5 5' });
  el('rect', { x: a.x - boxW / 2, y: boxTop, width: boxW, height: boxH, rx: 10, fill: C[a.id].fill, stroke: C[a.id].stroke, 'stroke-width': 2 });
  el('text', { x: a.x, y: boxTop + 25, 'text-anchor': 'middle', 'font-size': 16, 'font-weight': 700, fill: '#1f2328' }, a.title);
  el('text', { x: a.x, y: boxTop + 45, 'text-anchor': 'middle', 'font-size': 12.5, fill: '#5b616e' }, a.sub);
}

for (const [kind, s, yy] of draws) {
  if (kind === 'frame') {
    const x0 = X[s.from] - 92, x1 = X[s.to] + 92;
    el('rect', { x: x0, y: s.y0, width: x1 - x0, height: yy - s.y0, rx: 8, fill: 'none', stroke: '#8b949e', 'stroke-width': 1.2, 'stroke-dasharray': '6 4' });
    el('rect', { x: x0, y: s.y0, width: 104, height: 22, rx: 6, fill: '#eef0f3', stroke: '#8b949e', 'stroke-width': 1.2 });
    el('text', { x: x0 + 52, y: s.y0 + 15.5, 'text-anchor': 'middle', 'font-size': 12.5, 'font-weight': 700, fill: '#1f2328' }, s.label);
    el('text', { x: x0 + 114, y: s.y0 + 15.5, 'font-size': 12.5, 'font-style': 'italic', fill: '#444c56' }, s.cond);
  } else if (kind === 'arrow') {
    const [k, from, to, label] = s;
    const x1 = X[from], x2 = X[to];
    const dir = x2 > x1 ? 1 : -1;
    el('line', { x1: x1 + dir * 3, y1: yy, x2: x2 - dir * 3, y2: yy, stroke: '#1f2328', 'stroke-width': 1.6,
                 'marker-end': 'url(#a)', ...(k === 'ret' ? { 'stroke-dasharray': '7 5' } : {}) });
    el('text', { x: (x1 + x2) / 2, y: yy - 7, 'text-anchor': 'middle', 'font-size': 13, fill: '#1f2328' }, label);
  } else if (kind === 'self') {
    const x = X[s[1]];
    el('rect', { x: x - 8, y: yy - 6, width: 16, height: 40, fill: C.worker.fill, stroke: C.worker.stroke, 'stroke-width': 1.5 });
    el('path', { d: `M ${x + 8} ${yy} h 30 v 26 h -26`, fill: 'none', stroke: '#1f2328', 'stroke-width': 1.6, 'marker-end': 'url(#a)' });
    el('text', { x: x - 20, y: yy + 18, 'text-anchor': 'end', 'font-size': 13, fill: '#1f2328' }, s[2]);
  } else if (kind === 'note') {
    const x0 = 120, x1 = W - 120;
    el('rect', { x: x0, y: yy - 4, width: x1 - x0, height: 52, rx: 8, fill: '#fdebf1', stroke: '#d6336c', 'stroke-width': 1.5, 'stroke-dasharray': '6 4' });
    const words = s[1].split(' ');
    const lines = []; let line = '';
    for (const w of words) { if ((line + ' ' + w).length > 95) { lines.push(line); line = w; } else line = line ? line + ' ' + w : w; }
    lines.push(line);
    lines.forEach((t, i) => el('text', { x: W / 2, y: yy + 18 + i * 18, 'text-anchor': 'middle', 'font-size': 13, fill: '#1f2328' }, t));
  }
}
</script>
</body>
</html>
